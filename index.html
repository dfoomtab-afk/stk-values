<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-ROBLOX VALUES</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0b0b0f;
            color: #ffffff;
            min-height: 100vh;
            padding: 15px;
        }
        header {
            text-align: center;
            padding: 20px 0;
        }
        header h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ff2a2a;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(255, 42, 42, 0.4);
        }
        header p {
            color: #a0a0ab;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .search-container {
            margin: 15px 0;
        }
        #searchBox {
            width: 100%;
            padding: 12px 20px;
            background: #161622;
            border: 2px solid #232336;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }
        #searchBox:focus {
            border-color: #ff2a2a;
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.2);
        }
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar {
            display: none;
        }
        .cat-btn {
            background: #161622;
            border: 1px solid #232336;
            color: #a0a0ab;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.3s;
        }
        .cat-btn.active {
            background: #ff2a2a;
            color: #fff;
            border-color: #ff2a2a;
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.4);
        }
        /* تصميم الشبكة: 3 عناصر في الصف الواحد */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .item-card {
            background: #13131c;
            border: 1px solid #1f1f2e;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            transition: transform 0.2s;
        }
        .item-card:hover {
            transform: translateY(-2px);
            border-color: #ff2a2a;
        }
        .item-img-container {
            width: 100%;
            height: 105px;
            background: #1a1a26;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        .item-img-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
        }
        .no-img {
            color: #55556b;
            font-size: 0.65rem;
        }
        .item-name {
            font-size: 0.75rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-value {
            background: rgba(255, 42, 42, 0.1);
            color: #ff4d4d;
            font-size: 0.8rem;
            font-weight: 900;
            padding: 4px 2px;
            border-radius: 6px;
            border: 1px solid rgba(255, 42, 42, 0.2);
            direction: ltr;
        }
        @media (max-width: 480px) {
            header h1 { font-size: 1.5rem; }
            .item-img-container { height: 90px; }
            .item-name { font-size: 0.7rem; }
            .item-value { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>S-ROBLOX VALUES</h1>
        <p>قائمة الأسعار الرسمية والمحدثة للعبة Survive the Killer!</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchBox" placeholder="ابحث عن اسم السلاح أو القاتل..." oninput="filterItems()">
    </div>

    <!-- أزرار التصنيفات الجديدة بدون ملصقات وبحسب طلبك -->
    <div class="categories">
        <button class="cat-btn active" onclick="setCategory('all', this)">الكل</button>
        <button class="cat-btn" onclick="setCategory('knives', this)">السكاكين</button>
        <button class="cat-btn" onclick="setCategory('killers', this)">القتلة</button>
        <button class="cat-btn" onclick="setCategory('cabins', this)">كابينس</button>
        <button class="cat-btn" onclick="setCategory('crates', this)">الصناديق</button>
    </div>

    <div class="items-grid" id="itemsContainer">
        <!-- سيتم تعبئة البيانات تلقائياً من جوجل -->
    </div>

    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRnqGO2_Id31idT_N5MwcDSUMjcfkeeo1UD9C6EUABUyKZ5Ct0iUTZZ9QR6O_JPX8OOqMcs6qYe5Y2v/pub?output=csv";
        const GITHUB_IMAGES_BASE_URL = "https://raw.githubusercontent.com/dfoomtab-afk/stk-values/main/";

        let allData = [];
        let currentCategory = 'all';

        async function fetchSheetData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                parseCSV(data);
            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            allData = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const row = [];
                let inQuotes = false;
                let currentVal = '';
                for (let char of line) {
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(currentVal);
                        currentVal = '';
                    } else {
                        currentVal += char;
                    }
                }
                row.push(currentVal);

                if (row.length >= 4) {
                    let imageName = row[2].replace(/"/g, '').trim();
                    let imageUrl = imageName;
                    
                    if (imageName && !imageName.startsWith('http')) {
                        imageUrl = GITHUB_IMAGES_BASE_URL + imageName;
                    }

                    allData.push({
                        name: row[0].replace(/"/g, '').trim(),
                        value: row[1].replace(/"/g, '').trim(),
                        image: imageUrl,
                        category: row[3].replace(/"/g, '').trim().toLowerCase()
                    });
                }
            }
            displayItems(allData);
        }

        function formatNumber(numStr) {
            const num = parseInt(numStr.replace(/,/g, ''));
            if (isNaN(num)) return numStr;
            return num.toLocaleString('en-US');
        }

        function displayItems(items) {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<p style="grid-column: span 3; text-align: center; color: #777; padding: 20px;">لا توجد عناصر مطابقة</p>';
                return;
            }

            items.forEach(item => {
                const formattedVal = formatNumber(item.value);
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-img-container">
                        ${item.image ? `<img src="${item.image}" alt="${item.name}" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'no-img\'>خطأ في الصورة</span>';">` : `<span class="no-img">No Image</span>`}
                    </div>
                    <div class="item-name" title="${item.name}">${item.name}</div>
                    <div class="item-value">${formattedVal}</div>
                `;
                container.appendChild(card);
            });
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterItems();
        }

        function filterItems() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = allData.filter(item => {
                const matchesCat = currentCategory === 'all' || item.category === currentCategory;
                const matchesSearch = item.name.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
            displayItems(filtered);
        }

        fetchSheetData();
    </script>
</body>
</html>
